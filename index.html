<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Ahsan - Developer Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    
    /* Glowing Gradients */
    .glow-cyan {
      box-shadow: 0 0 50px -10px rgba(6, 182, 212, 0.35);
    }
    .text-gradient {
      background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* CSS 3D Card Animation */
    .avatar-card-container {
      perspective: 1000px;
    }
    .avatar-card {
      transition: transform 0.5s ease, box-shadow 0.5s ease;
      transform-style: preserve-3d;
    }
    .avatar-card:hover {
      transform: rotateY(8deg) rotateX(-5deg) translateY(-8px);
      box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.4);
    }
    .avatar-3d-img {
      transform: translateZ(30px);
    }

    /* Floating Particles Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

  <!-- Background Animated Particles -->
  <canvas id="bg-canvas"></canvas>

  <!-- Navigation -->
  <nav class="relative z-10 max-w-6xl mx-auto w-full px-6 py-6 flex items-center justify-between">
    <a href="#" class="font-heading text-2xl font-bold tracking-wider text-white">
      AHSAN<span class="text-cyan-400">.</span>
    </a>
    <div class="flex items-center space-x-6 text-sm font-medium">
      <a href="#about" class="hover:text-cyan-400 transition-colors">About</a>
      <a href="#contact" class="hover:text-cyan-400 transition-colors">Contact</a>
      <a href="admin.html" class="px-4 py-2 border border-cyan-500/30 rounded-full text-cyan-400 hover:bg-cyan-500/10 transition-all">
        <i class="fa-solid fa-lock text-xs mr-1"></i> Admin
      </a>
    </div>
  </nav>

  <!-- Hero & Main Section -->
  <main class="relative z-10 max-w-6xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
    
    <!-- Left Column: Bio & Intro -->
    <div class="lg:col-span-7 space-y-6">
      <div class="inline-flex items-center px-3 py-1 rounded-full border border-cyan-500/20 bg-cyan-500/10 text-cyan-300 text-xs tracking-wider uppercase">
        <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> Available for Projects
      </div>

      <h1 class="font-heading text-4xl sm:text-6xl font-extrabold text-white leading-tight">
        Hello! I'm <br />
        <span id="display-name" class="text-gradient">Muhammad Ahsan</span>
      </h1>

      <p id="display-title" class="text-xl sm:text-2xl font-medium text-slate-300 font-heading tracking-wide">
        Full-Stack Web Developer & UI Creator
      </p>

      <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 backdrop-blur-md glow-cyan">
        <h3 class="text-xs uppercase tracking-widest text-cyan-400 font-semibold mb-2">About Me</h3>
        <p id="display-bio" class="text-slate-300 leading-relaxed">
          Loading bio from Realtime Database...
        </p>
      </div>

      <!-- Social Links -->
      <div class="pt-2 flex items-center space-x-4">
        <a id="link-github" href="#" target="_blank" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
          <i class="fa-brands fa-github text-xl"></i>
        </a>
        <a id="link-linkedin" href="#" target="_blank" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
          <i class="fa-brands fa-linkedin-in text-xl"></i>
        </a>
        <a id="link-tiktok" href="#" target="_blank" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
          <i class="fa-brands fa-tiktok text-xl"></i>
        </a>
        <a id="link-email" href="#" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all">
          <i class="fa-regular fa-envelope text-xl"></i>
        </a>
      </div>
    </div>

    <!-- Right Column: 3D Avatar Card -->
    <div class="lg:col-span-5 flex justify-center">
      <div class="avatar-card-container w-full max-w-sm">
        <div class="avatar-card relative rounded-3xl bg-gradient-to-b from-slate-800/80 to-slate-900/90 p-6 border border-slate-700/50 backdrop-blur-xl shadow-2xl">
          <div class="relative w-full aspect-square rounded-2xl overflow-hidden bg-slate-950 flex items-center justify-center border border-slate-800">
            <!-- Dynamic 3D Graphic Background Effect -->
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-500/20 via-transparent to-transparent"></div>
            
            <!-- User Portrait / Styled Avatar Image -->
            <img 
              src="https://raw.githubusercontent.com/mianzai007w-cmyk/assets/main/ahsan.jpg" 
              onerror="this.src='e1ef1009-4f45-4ce9-9cec-0d3bab770b18 (2).jpg'"
              alt="Muhammad Ahsan Avatar" 
              class="avatar-3d-img relative z-10 object-cover w-full h-full rounded-2xl shadow-lg border border-slate-700/60" 
            />
          </div>
          
          <div class="mt-4 text-center">
            <span class="text-xs font-mono text-cyan-400">@muhammad.ahsan</span>
            <p class="text-sm text-slate-400 mt-1">Interactive 3D Digital Portfolio Profile</p>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Muhammad Ahsan. All rights reserved.</p>
  </footer>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
      authDomain: "reakweb.firebaseapp.com",
      databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
      projectId: "reakweb",
      storageBucket: "reakweb.firebasestorage.app",
      messagingSenderId: "228639861953",
      appId: "1:228639861953:web:2941663bb550703b61b840"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Fetch live data from Firebase Realtime Database
    const profileRef = ref(db, 'portfolio/profile');
    onValue(profileRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if(data.name) document.getElementById('display-name').textContent = data.name;
        if(data.title) document.getElementById('display-title').textContent = data.title;
        if(data.bio) document.getElementById('display-bio').textContent = data.bio;
        if(data.github) document.getElementById('link-github').href = data.github;
        if(data.linkedin) document.getElementById('link-linkedin').href = data.linkedin;
        if(data.tiktok) document.getElementById('link-tiktok').href = data.tiktok;
        if(data.email) document.getElementById('link-email').href = "mailto:" + data.email;
      }
    });

    // Simple Background Particle Canvas
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
